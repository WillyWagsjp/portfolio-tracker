name: Update Portfolio Data

on:
  schedule:
    # Runs once a day at 22:00 UTC (7am JST) - adjust as you like
    - cron: '0 22 * * *'
  workflow_dispatch:
    # Lets you manually trigger it from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run price fetch script
        run: python scripts/fetch_prices.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Update portfolio data [automated]"
          git push