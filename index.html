<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Wills Portfolio Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Portfolio Tracker</h1>
                <p class="subtitle">Last updated: <span id="last-updated">-</span></p>
            </header>

            <section class="summary-cards">
                <div class="card">
                    <p class="card-label">Total Value</p>
                    <p class="card-value" id="total-value">-</p>
                </div>
                <div class="card">
                    <p class="card-label">Total Cost</p>
                    <p class="card-value" id="total-cost"></p>
                </div>
                <div class="card">
                    <p class="card-label">Total Gain/Loss</p>
                    <p class="card-value" id="total-gain">-</p>
                </div>
                <div class="card">
                    <p class="card-label">Return</p>
                    <p class="card-value" id="total-gain-pct">-</p>
                </div>
            </section>

            <section class="chart-section">
                <h2>Portfolio Value Over Time</h2>
                <canvas id="history-chart"></canvas>
            </section>

            <section class="holdings-section">
                <h2>Holdings</h2>
                <table id="holdings-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Shares</th>
                            <th>Current Price</th>
                            <th>Cost Basis</th>
                            <th>Value</th>
                            <th>Gain/Loss</th>
                            <th>Return</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-body">

                    </tbody>
                </table>
            </section>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="app.js"></script>
    </body>
</html>
